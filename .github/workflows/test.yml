# The action on a small vitest project, the way a customer uses it: one
# line, then the project's own test commands (an npm script, npx, the .bin
# shim). The job records as it runs: the first run records, the second is
# the second witness, the third replays.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production-readiness:
        description: Fresh-job shipped ordinary-native and signed Cloud acceptance
        type: boolean
        required: false
        default: false
      cloud-transport:
        description: OIDC Cloud publication and signed clean readback only (no replay claim)
        type: boolean
        required: false
        default: false
jobs:
  check:
    if: ${{ !inputs.production-readiness && !inputs.cloud-transport }}
    runs-on: ubuntu-latest
    # The README's set-up: Quod Cloud carries the ledger (the Actions cache
    # is the fallback when the server is not reachable or this repository is
    # in no Quod team).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the action (dist/)
        run: npm install --no-audit --no-fund && npm run build
      - uses: ./
      - run: npm install --no-audit --no-fund
        working-directory: test
      - run: npm test
        working-directory: test
      - run: npx vitest run tests/add.test.js
        working-directory: test
      - name: The second witness, then replays
        working-directory: test
        run: |
          npm test
          npm test 2>&1 | tee out.txt
          grep -E 'replaying [1-9]' out.txt
      - name: QUOD_DISABLE=1 is plain vitest
        run: npm test 2>&1 | tee out.txt; ! grep -q 'quod vitest' out.txt
        working-directory: test
        env:
          QUOD_DISABLE: 1
      - name: A failing test fails the command
        working-directory: test
        run: |
          echo "import { test, expect } from 'vitest'; test('fails', () => expect(1).toBe(2))" > tests/fail.test.js
          if npx vitest run tests/fail.test.js; then echo "::error::a failing test passed"; exit 1; fi
          rm tests/fail.test.js


  product-plain:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs plain "$RUNNER_TEMP/product-readiness-plain"
      - name: Capture plain complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs plain "$RUNNER_TEMP/product-readiness-plain"
      - name: Retain only sanitized synthetic plain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-plain
          path: |
            ${{ runner.temp }}/product-readiness-plain/result.json
            ${{ runner.temp }}/product-readiness-plain/installation.json
          if-no-files-found: error
          retention-days: 3

  product-record:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-plain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Use the shipped default ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs record "$RUNNER_TEMP/product-readiness-record"
      - name: Capture record complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs record "$RUNNER_TEMP/product-readiness-record"
      - name: Retain only sanitized synthetic record evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-record
          path: |
            ${{ runner.temp }}/product-readiness-record/result.json
            ${{ runner.temp }}/product-readiness-record/installation.json
          if-no-files-found: error
          retention-days: 3

  product-witness:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Use the shipped default ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs witness "$RUNNER_TEMP/product-readiness-witness"
      - name: Capture witness complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs witness "$RUNNER_TEMP/product-readiness-witness"
      - name: Retain only sanitized synthetic witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-witness
          path: |
            ${{ runner.temp }}/product-readiness-witness/result.json
            ${{ runner.temp }}/product-readiness-witness/installation.json
          if-no-files-found: error
          retention-days: 3

  product-replay:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-witness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Use the shipped default ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs replay "$RUNNER_TEMP/product-readiness-replay"
      - name: Capture replay complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs replay "$RUNNER_TEMP/product-readiness-replay"
      - name: Retain only sanitized synthetic replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-replay
          path: |
            ${{ runner.temp }}/product-readiness-replay/result.json
            ${{ runner.temp }}/product-readiness-replay/installation.json
          if-no-files-found: error
          retention-days: 3

  product-changed:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Use the shipped default ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs changed "$RUNNER_TEMP/product-readiness-changed"
      - name: Capture changed complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs changed "$RUNNER_TEMP/product-readiness-changed"
      - name: Retain only sanitized synthetic changed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-changed
          path: |
            ${{ runner.temp }}/product-readiness-changed/result.json
            ${{ runner.temp }}/product-readiness-changed/installation.json
          if-no-files-found: error
          retention-days: 3

  product-fallback:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Use the shipped default ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          server: http://127.0.0.1:1
      - name: Require the actual install or exact dependency-cache skip
        run: node .quod-action/test/product-readiness-install.mjs fallback "$RUNNER_TEMP/product-readiness-fallback"
      - name: Capture fallback complete native results and actual replay statistics
        run: node .quod-action/test/product-readiness-run.mjs fallback "$RUNNER_TEMP/product-readiness-fallback"
      - name: Retain only sanitized synthetic fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-fallback
          path: |
            ${{ runner.temp }}/product-readiness-fallback/result.json
            ${{ runner.temp }}/product-readiness-fallback/installation.json
          if-no-files-found: error
          retention-days: 3

  product-cloud:
    if: ${{ inputs.production-readiness && !inputs.cloud-transport }}
    needs: product-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      # Run before the changed-input failure can publish a newer ledger.
      # No Action, install, cache restore or preexisting local ledger exists.
      - name: Read only the sanitized current cold-record state reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: product-readiness-record
          path: ${{ runner.temp }}/product-readiness-record-reference
      - name: Require signed Cloud readback into empty directories and reject a wrong key
        run: >-
          node .quod-action/test/product-readiness-cloud.mjs
          "$RUNNER_TEMP/product-readiness-cloud"
          "$RUNNER_TEMP/product-readiness-record-reference/result.json"
      - name: Retain only sanitized signed-readback metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-cloud
          path: ${{ runner.temp }}/product-readiness-cloud/cloud-readback.json
          if-no-files-found: error
          retention-days: 3

  product-validator:
    if: ${{ always() && inputs.production-readiness && !inputs.cloud-transport }}
    needs: [product-plain, product-record, product-witness, product-replay, product-cloud, product-changed, product-fallback]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Read the seven sanitized fresh-job and signed-readback records
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: product-readiness-*
          path: ${{ runner.temp }}/product-readiness-inputs
          merge-multiple: false
      - name: Validate complete results, replay, native failure and signed transport
        if: always()
        run: >-
          node .quod-action/test/product-readiness-validate.mjs
          "$RUNNER_TEMP/product-readiness-inputs"
          "$RUNNER_TEMP/product-readiness-inputs/product-readiness-cloud"
          "$RUNNER_TEMP/product-readiness-validation"
      - name: Retain only sanitized acceptance and signed-readback metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-readiness-acceptance
          path: ${{ runner.temp }}/product-readiness-validation/acceptance.json
          if-no-files-found: error
          retention-days: 3

  product-cloud-transport-record:
    if: ${{ inputs.cloud-transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
      QUOD_VITEST_CLOUD_FALLBACK: '0'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require mutually exclusive manual proof selection
        if: ${{ inputs.production-readiness }}
        run: |
          echo '::error::Select cloud-transport or production-readiness, never both.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      - name: Require actual job OIDC rather than a static server token
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/exp/product-native-readiness-sol-ultra
          test -z "${QUOD_SERVER_TOKEN:-}"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Use the unchanged shipped ordinary-native Action
        uses: ./.quod-action
        with:
          cache-namespace: product-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require the actual cold install
        run: node .quod-action/test/product-readiness-install.mjs record "$RUNNER_TEMP/product-cloud-transport-record"
      - name: Record both original files and all seven native assertion states
        run: node .quod-action/test/product-readiness-run.mjs record "$RUNNER_TEMP/product-cloud-transport-record"
      - name: Retain only the sanitized current cold-record reference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-cloud-transport-record
          path: |
            ${{ runner.temp }}/product-cloud-transport-record/result.json
            ${{ runner.temp }}/product-cloud-transport-record/installation.json
          if-no-files-found: error
          retention-days: 3

  product-cloud-transport-readback:
    if: ${{ inputs.cloud-transport && !inputs.production-readiness }}
    # Job dependencies include the producer's deferred Cloud-save post.
    needs: product-cloud-transport-record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_WITNESS_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
      QUOD_VITEST_CLOUD_FALLBACK: '0'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /product-fixture/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .quod-action
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - name: Require the exact shipped Action and tracked customer fixture lock
        run: node .quod-action/test/product-readiness-layout.mjs
      # No Action, install, cache restore or local ledger in this fresh job.
      - name: Read only this run's sanitized producer reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: product-cloud-transport-record
          path: ${{ runner.temp }}/product-cloud-transport-record-reference
      - name: Require current-run signed clean readback and wrong-key rejection
        run: >-
          node .quod-action/test/product-cloud-transport-readback.mjs
          "$RUNNER_TEMP/product-cloud-transport-readback"
          "$RUNNER_TEMP/product-cloud-transport-record-reference/result.json"
      - name: Retain only sanitized Cloud transport proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-cloud-transport-readback
          path: ${{ runner.temp }}/product-cloud-transport-readback/cloud-transport.json
          if-no-files-found: error
          retention-days: 3
