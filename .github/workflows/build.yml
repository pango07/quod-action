# Builds dist/ (the bundled action) on GitHub, so nothing is built on a
# developer's machine, and commits it when it changed. Then a test of the
# action itself on a small vitest project.
name: build
on:
  push:
    branches: [main]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit dist
        run: |
          git add -f dist
          if git diff --cached --quiet; then echo "dist unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "dist: build of ${GITHUB_SHA::7}"
          git push
