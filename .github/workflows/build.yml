# The experimental Action and Linux runtime are built only on GitHub runners.
name: build
on:
  workflow_dispatch:
    inputs:
      npm-install-equivalence:
        description: Run only the finite real npm-ci materialization gate
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/exp/') && !inputs['npm-install-equivalence']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - id: source
        name: Read pinned managed source
        run: |
          node -e 'const s=require("./managed-source.json");if(s.repository!=="pango07/quod"||!/^[a-f0-9]{40}$/.test(s.commit))throw Error("invalid source pin");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"sha="+s.commit+"\n")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pango07/quod
          ref: ${{ steps.source.outputs.sha }}
          path: .build/source
          persist-credentials: false
      - name: Install Action dependencies and build bundles
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          rm -rf dist/managed-bridge
          rm -rf dist/matrix-bridge
          npm run build
      - name: Freeze the production fixture dependency tree
        run: |
          set -euo pipefail
          test -f product-fixture/package.json
          if [ ! -f product-fixture/package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix product-fixture
          fi
      - name: Install pinned managed dependencies
        working-directory: .build/source/scripts/bench-vitest/managed
        run: npm ci --no-audit --no-fund
      - name: Package the managed runtime
        run: |
          mkdir -p .build/runtime dist/managed
          cp .build/source/scripts/bench-vitest/managed/*.mjs .build/runtime/
          cp .build/source/scripts/bench-vitest/managed/package*.json .build/runtime/
          cp -a .build/source/scripts/bench-vitest/managed/node_modules .build/runtime/
          test -f .build/runtime/dispatcher.mjs
          test -f .build/runtime/matrix-input-dispatcher.mjs
          test -f .build/runtime/resolved-compile-certificate.mjs
          test -f .build/runtime/matrix-candidate-envelope.mjs
          test -f .build/runtime/matrix-receipt.mjs
          test -f .build/runtime/matrix-native.mjs
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C .build/runtime -czf dist/managed/runtime.tar.gz .
          node -e 'const fs=require("fs"),c=require("crypto");fs.writeFileSync("dist/managed/manifest.json",JSON.stringify({schema:"quod-managed-action-runtime-v1",source:require("./managed-source.json"),sha256:c.createHash("sha256").update(fs.readFileSync("dist/managed/runtime.tar.gz")).digest("hex")},null,2)+"\n")'
      - name: Action unit regression checks
        # test/*.mjs are packaged-CLI acceptance drivers. The Quod repository's
        # benchmark-action gate supplies their fixture, hook and CLI arguments.
        run: node --test src/*.test.js
      - name: Commit reviewed-branch build output
        run: |
          set -euo pipefail
          # A first build records dependency resolution; later builds use npm ci.
          # Product consumers use the committed bundles and never rebuild them.
          git diff --exit-code -- . ':!dist' ':!package-lock.json' ':!product-fixture/package-lock.json'
          git add -f dist package-lock.json product-fixture/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name="Julio Vaught" -c user.email="juliovaught@yahoo.com" commit -m "Build Quod Action at ${GITHUB_SHA::7}" -m "Co-Authored-By: OpenAI Codex <noreply@openai.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
  npm-install-equivalence:
    if: github.ref == 'refs/heads/exp/npm-install-equivalence-sol-ultra' && inputs['npm-install-equivalence']
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - name: Install Action dependencies for the existing source regression suite
        run: npm install --no-audit --no-fund
      - name: Inventory and normalization regression checks
        run: node --test src/*.test.js test/npm-install-equivalence.test.mjs
      - name: Compare eight real npm-ci tuples and an independent baseline repeat
        run: node test/npm-install-equivalence.mjs "$RUNNER_TEMP/npm-install-equivalence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: npm-install-equivalence
          path: ${{ runner.temp }}/npm-install-equivalence/
          if-no-files-found: error
          retention-days: 7
