# The shadow for test.yml, exactly as the README tells a customer to add it.
name: Quod shadow
on:
  workflow_run:
    workflows: [test]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  record:
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the action (dist/)
        run: npm install --no-audit --no-fund && npm run build
      - uses: ./
        with:
          mode: shadow
      - run: npm install --no-audit --no-fund
        working-directory: test
      - run: npm test
        working-directory: test
      - run: npx vitest run tests/add.test.js
        working-directory: test
