name: Quod
description: >
  Makes your Node CI job faster without changing it: one line after
  setup-node. Restores your dependencies before your install step (npm ci
  finds node_modules in place), points turbo's and Nx's remote cache at Quod
  Cloud, and replays the vitest test files whose inputs did not change. The
  job records as it runs: a record replays once a second run agrees with it,
  and files that fail only while recording run again plain, so Quod never
  turns a green job red. No second job.
author: pango07
branding:
  icon: fast-forward
  color: purple
inputs:
  mode:
    description: >
      check (default): your CI job. Every `vitest run` replays what the
      ledger proves unchanged (seen twice: the second witness) and runs and
      records the rest, then saves the ledger (Quod Cloud, else the Actions
      cache). shadow: the older separate recording job
      (.github/workflows/shadow.yml); still works, no longer needed.
    required: false
    default: check
  record:
    description: >
      check mode: record in this job (true, the default). false: only read the
      ledger, as before, for a setup that keeps the shadow job.
    required: false
    default: 'true'
  version:
    description: >
      The quod release (a bin-<sha> release of pango07/ci-bench). The default
      ships with this action (dist/quod/), so a job fetches nothing; another
      is downloaded.
    required: false
    default: bin-34f932d
  sha256:
    description: SHA-256 of that release's quod-linux-x86_64.tar.gz (required when version is set)
    required: false
    default: ''
  cloud:
    description: >
      Use Quod Cloud for the ledger when this quod supports it and the job has
      `permissions: id-token: write` (true); false keeps it in the Actions cache.
    required: false
    default: 'true'
  dependencies:
    description: >
      Restore and save what your install puts down (true): node_modules for npm
      (`npm ci` then finds it in place), the store for pnpm, yarn and bun.
      false leaves your install alone.
    required: false
    default: 'true'
  task-cache:
    description: >
      Point turbo's (TURBO_API, TURBO_TOKEN, TURBO_TEAM) and Nx's remote cache at
      Quod Cloud when the job has `permissions: id-token: write` and none of your
      own is configured (true); false leaves them alone.
    required: false
    default: 'true'
  lineage-witness:
    description: >
      Reuse a plain-confirmed predecessor as the second witness after a
      changed input, only when the new recorded read set and test states
      agree and no test is near a timeout. Audit one in eight plain;
      disagreement revokes the promotion batch. Experimental and switchable.
    required: false
    default: 'false'
  timing-sensitive:
    description: >
      off (default): a test file whose plain run took more than half a
      test's timeout always runs. replay: it replays once two plain runs of
      its unchanged inputs passed, and the log says at what fraction of its
      timeout it passed (the timeout is the runner's load, not the code).
    required: false
    default: 'off'
  timing-audit:
    description: >
      With timing-sensitive: replay, every Nth replay of such a file runs it
      plain instead; a timeout there quarantines it (0: never).
    required: false
    default: '0'
  server:
    description: The Quod Cloud server
    required: false
    default: https://api.quodci.com
  server-key:
    description: The server's Ed25519 public key (every answer is signed by it)
    required: false
    default: d23312bfc239da7dcd29c651dff3aea71beb08f0b3a732dff040f461a259f9f8
  job-id:
    description: This job's check run, for Quod Cloud's reports
    required: false
    default: ${{ job.check_run_id }}
  token:
    description: Reads a triggering CI run's report artifact (a workflow_run shadow)
    required: false
    default: ${{ github.token }}
runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
